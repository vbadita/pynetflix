[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pynetflix"
version = "2.0.0"
description = "Your own Netflix account as a local API: history, stats, removal tracking, REST and MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
sync = ["playwright>=1.40"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
mcp = ["mcp>=1.2"]
all = ["pynetflix[sync,api,mcp]"]
dev = ["pynetflix[api,mcp]", "pytest>=8", "httpx>=0.27"]

[project.scripts]
pynetflix = "pynetflix.cli:main"

[tool.setuptools]
packages = ["pynetflix"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E702"]  # short `where.append(...); params.append(...)` pairs read better on one line
